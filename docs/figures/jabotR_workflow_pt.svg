<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 910" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6D3B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="910" fill="#F5F9F3"/>
  <text x="40" y="42" font-size="24" font-weight="700" fill="#1F4D2B">Fluxo de trabalho do jabotR</text>
  <text x="40" y="64" font-size="13" fill="#4A6B50">Da rede JABOT a coleções de herbário melhores: acessar, filtrar, avaliar e aprimorar os dados de espécimes</text>

  <text font-size="14" font-weight="700" fill="#2F6D3B">
    <tspan x="40" y="131">1. ACESSAR E</tspan>
    <tspan x="40" y="149">LER DADOS</tspan>
  </text>
  <g font-size="13.5">
    <rect x="265" y="114" width="190" height="52" rx="10" fill="#EEF6EC" stroke="#6FA876" stroke-width="1.5"/>
    <text x="360.0" y="145.0" text-anchor="middle" fill="#1F4D2B" font-weight="600">jabot_summary()</text>
    <rect x="495" y="114" width="190" height="52" rx="10" fill="#EEF6EC" stroke="#6FA876" stroke-width="1.5"/>
    <text x="590.0" y="145.0" text-anchor="middle" fill="#1F4D2B" font-weight="600">jabot_download()</text>
    <rect x="725" y="114" width="190" height="52" rx="10" fill="#EEF6EC" stroke="#6FA876" stroke-width="1.5"/>
    <text x="820.0" y="145.0" text-anchor="middle" fill="#1F4D2B" font-weight="600">jabot_parse()</text>
  </g>
  <line x1="455" y1="140" x2="491" y2="140" stroke="#2F6D3B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="685" y1="140" x2="721" y2="140" stroke="#2F6D3B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M820,166 L820,222 L380,222 L380,224" fill="none" stroke="#2F6D3B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M820,166 L820,222 L660,222 L660,224" fill="none" stroke="#2F6D3B" stroke-width="2" marker-end="url(#arrow)"/>

  <text font-size="14" font-weight="700" fill="#2F6D3B">
    <tspan x="40" y="252">2. FILTRAR REGISTROS</tspan>
    <tspan x="40" y="270">DE ESPÉCIMES</tspan>
  </text>
  <g font-size="13.5">
    <rect x="265" y="228" width="230" height="58" rx="10" fill="#EEF6EC" stroke="#6FA876" stroke-width="1.5"/>
    <text x="380.0" y="254" text-anchor="middle" fill="#1F4D2B" font-weight="600">jabot_records()</text>
    <text x="380.0" y="272" text-anchor="middle" fill="#5E7F63" font-size="11">táxon / herbário / estado / ano</text>
    <rect x="535" y="228" width="250" height="58" rx="10" fill="#EEF6EC" stroke="#6FA876" stroke-width="1.5"/>
    <text x="660.0" y="254" text-anchor="middle" fill="#1F4D2B" font-weight="600">jabot_indets()</text>
    <text x="660.0" y="272" text-anchor="middle" fill="#5E7F63" font-size="11">indeterminados em família e gênero</text>
  </g>
  <path d="M660,286 L660,344 L380,344 L380,346" fill="none" stroke="#2F6D3B" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <text font-size="14" font-weight="700" fill="#2F6D3B">
    <tspan x="40" y="378">3. AVALIAR UM HERBÁRIO</tspan>
    <tspan x="40" y="396">CONTRA A FFB</tspan>
  </text>
  <g font-size="13.5">
    <rect x="265" y="350" width="230" height="58" rx="10" fill="#EEF6EC" stroke="#6FA876" stroke-width="1.5"/>
    <text x="380.0" y="376" text-anchor="middle" fill="#1F4D2B" font-weight="600">jabot_gaps()</text>
    <text x="380.0" y="394" text-anchor="middle" fill="#5E7F63" font-size="11">espécies ausentes do herbário</text>
    <rect x="535" y="350" width="230" height="58" rx="10" fill="#EEF6EC" stroke="#6FA876" stroke-width="1.5"/>
    <text x="650.0" y="376" text-anchor="middle" fill="#1F4D2B" font-weight="600">jabot_coverage()</text>
    <text x="650.0" y="394" text-anchor="middle" fill="#5E7F63" font-size="11">representatividade da FFB</text>
    <rect x="805" y="350" width="300" height="58" rx="10" fill="#EEF6EC" stroke="#6FA876" stroke-width="1.5"/>
    <text x="955.0" y="376" text-anchor="middle" fill="#1F4D2B" font-weight="600">jabot_missing()</text>
    <text x="955.0" y="394" text-anchor="middle" fill="#5E7F63" font-size="11">lacunas regionais e prioridades de coleta</text>
  </g>
  <text x="1105" y="424" text-anchor="end" font-size="11" fill="#5E7F63">Relatórios HTML</text>

  <rect x="40" y="440" width="1100" height="350" rx="16" fill="#DCEFD8" stroke="#2F6D3B" stroke-width="2.5"/>
  <text x="60" y="470" font-size="14" font-weight="700" fill="#1F4D2B">4. APRIMORAR A COLEÇÃO</text>
  <text x="60" y="488" font-size="11" fill="#1F4D2B">usa a sigla de um herbário ou funciona offline &#8212; sem etapa anterior obrigatória</text>
  <g font-size="12" font-weight="700" fill="#1F4D2B">
    <text x="320" y="522" text-anchor="middle">ENCONTRAR IDENTIFICAÇÕES</text>
    <text x="860" y="522" text-anchor="middle">ORGANIZAR NOVOS DADOS DE CAMPO</text>
  </g>
  <rect x="60" y="534" width="520" height="150" rx="10" fill="#FFFFFF" stroke="#2F6D3B" stroke-width="1.5"/>
  <text x="320.0" y="566" text-anchor="middle" fill="#1F4D2B" font-weight="600" font-size="13">jabot_identify()</text>
  <text x="320.0" y="590" text-anchor="middle" fill="#4A6B50" font-size="10.5">Busca, na rede JABOT e no REFLORA</text>
  <text x="320.0" y="606" text-anchor="middle" fill="#4A6B50" font-size="10.5">(refloraR), as duplicatas dos espécimes</text>
  <text x="320.0" y="622" text-anchor="middle" fill="#4A6B50" font-size="10.5">indeterminados de um herbário (barRoso)</text>
  <text x="320.0" y="638" text-anchor="middle" fill="#4A6B50" font-size="10.5">e sugere identificações a partir das</text>
  <text x="320.0" y="654" text-anchor="middle" fill="#4A6B50" font-size="10.5">duplicatas já identificadas em outros herbários</text>
  <text x="320.0" y="670" text-anchor="middle" fill="#4A6B50" font-size="10.5" font-style="italic">taxon opcional: restringe a uma família ou gênero</text>
  <rect x="600" y="534" width="520" height="150" rx="10" fill="#FFFFFF" stroke="#2F6D3B" stroke-width="1.5"/>
  <text x="860.0" y="566" text-anchor="middle" fill="#1F4D2B" font-weight="600" font-size="13">jabot_fieldbook()</text>
  <text x="860.0" y="590" text-anchor="middle" fill="#4A6B50" font-size="10.5">Caderno de campo offline (abre no</text>
  <text x="860.0" y="606" text-anchor="middle" fill="#4A6B50" font-size="10.5">navegador): organize eventos de coleta e</text>
  <text x="860.0" y="622" text-anchor="middle" fill="#4A6B50" font-size="10.5">espécimes e exporte a planilha Jabot e</text>
  <text x="860.0" y="638" text-anchor="middle" fill="#4A6B50" font-size="10.5">um caderno de campo imprimível</text>
  <text x="860.0" y="654" text-anchor="middle" fill="#4A6B50" font-size="10.5">em formato PDF</text>
  <rect x="470" y="710" width="240" height="58" rx="10" fill="#2F6D3B"/>
  <text x="590" y="735" text-anchor="middle" fill="#F2FAF0" font-weight="700" font-size="13">Revisão do curador</text>
  <text x="590" y="752" text-anchor="middle" fill="#F2FAF0" font-size="11">&#8594; coleções mais bem identificadas</text>
  <path d="M320,684 L320,696 L530,696 L530,706" fill="none" stroke="#2F6D3B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M860,684 L860,696 L650,696 L650,706" fill="none" stroke="#2F6D3B" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="11.5" fill="#4A6B50">
    <rect x="40" y="816" width="14" height="14" fill="#EEF6EC" stroke="#6FA876"/>
    <text x="60" y="827">Acessar, filtrar e avaliar dados de herbário (Etapas 1-3)</text>
    <rect x="560" y="816" width="14" height="14" fill="#DCEFD8" stroke="#2F6D3B"/>
    <text x="580" y="827">Ferramentas para aprimorar a coleção (Etapa 4)</text>
  </g>
  <text x="40" y="860" font-size="12" fill="#5E7F63">As funções baixam e leem os arquivos DwC-A do JABOT automaticamente e os reutilizam a partir de jabot_path (REFLORA: reflora_path),</text>
  <text x="40" y="878" font-size="12" fill="#5E7F63">então jabot_download()/jabot_parse() raramente precisam ser chamadas diretamente.</text>
</svg>
